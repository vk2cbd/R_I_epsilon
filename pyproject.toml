[project]
name = "radio-interferometer"
version = "0.2.1"
description = "Tkinter FX correlator GUI for two-channel radio interferometry."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
